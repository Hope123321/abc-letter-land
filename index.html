<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABC 字母樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one-screen playground. Sky above, grass hill below; a white "flash card" asks, chunky candy tiles answer. */
:root {
  color-scheme: light;
  --sky-top: #AEE0FF;
  --sky-low: #E9F8FF;
  --grass: #96DE84;
  --ink: #2B2A4C;
  --ink-soft: #6A6990;
  --paper: #FFFFFF;
  --line: #D5E6F2;
  --good: #3CCB7F;
  --good-d: #23975A;
  --bad: #C9CEDA;
  --gold: #FFC531;
  --t1: #FFD84D; --t1d: #D9A400;
  --t2: #8FE3B4; --t2d: #48B27C;
  --t3: #8ACBFF; --t3d: #3F94D6;
  --t4: #FFA9C4; --t4d: #DB6C91;
  --t5: #CBB2FF; --t5d: #8F6EDB;
  --t6: #FFBB7A; --t6d: #DB8436;
  --font-letter: "Baloo 2", "Arial Rounded MT Bold", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --font-text: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
  --r: 22px;
}
html, body { height: 100%; }
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(130% 34% at 50% 112%, var(--grass) 0 62%, transparent 63%),
    linear-gradient(var(--sky-top), var(--sky-low) 70%);
  background-color: var(--sky-low);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 17px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

.screen { flex: 1; min-height: 0; width: 100%; max-width: 860px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }

/* chunky pressable button */
.chunk {
  background: var(--bg, var(--t1));
  box-shadow: 0 6px 0 var(--bgd, var(--t1d));
  border-radius: var(--r);
  transition: transform .08s, box-shadow .08s;
}
.chunk:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--bgd, var(--t1d)); }
.c1 { --bg: var(--t1); --bgd: var(--t1d); } .c2 { --bg: var(--t2); --bgd: var(--t2d); }
.c3 { --bg: var(--t3); --bgd: var(--t3d); } .c4 { --bg: var(--t4); --bgd: var(--t4d); }
.c5 { --bg: var(--t5); --bgd: var(--t5d); } .c6 { --bg: var(--t6); --bgd: var(--t6d); }

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; flex: none; }
.round-btn {
  width: 52px; height: 52px; flex: none; border-radius: 50%;
  background: var(--paper); box-shadow: 0 4px 0 var(--line);
  font-size: 24px; display: grid; place-items: center;
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.bar-mid { flex: 1; min-width: 0; display: flex; justify-content: center; }

/* ---------- home ---------- */
#home { overflow-y: auto; padding-bottom: 12px; }
.hero { text-align: center; flex: none; }
.logo { font-family: var(--font-letter); font-weight: 800; font-size: clamp(3rem, 15vmin, 5.5rem); line-height: 1; letter-spacing: .04em; margin: 0; }
.logo span { display: inline-block; text-shadow: 0 5px 0 rgba(43,42,76,.14); animation: bob 2.4s ease-in-out infinite; }
.logo span:nth-child(1) { color: #FF7A9C; }
.logo span:nth-child(2) { color: #FFB400; animation-delay: .2s; }
.logo span:nth-child(3) { color: #3F94D6; animation-delay: .4s; }
.sub { margin: 2px 0 0; font-size: clamp(1.2rem, 5vmin, 1.7rem); font-weight: 800; letter-spacing: .12em; }
.pick { margin: 0; text-align: center; color: var(--ink-soft); font-weight: 700; flex: none; }
.diff { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex: none; }
.diff button {
  --bg: var(--paper); --bgd: var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 76px; padding: 8px 4px; font-size: 1.2rem; font-weight: 800;
}
.diff button[aria-pressed="true"] { --bg: var(--t1); --bgd: var(--t1d); outline: 4px solid var(--ink); outline-offset: -4px; }
.diff .dpic { font-size: 1.7rem; line-height: 1; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 16px; flex: none; }
.level {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 12px 8px; text-align: center; min-height: 132px;
}
.level .pic { font-size: 2.8rem; line-height: 1.1; }
.level .name { font-size: 1.2rem; font-weight: 800; }
.level .best { font-size: 1rem; letter-spacing: 2px; white-space: nowrap; }
.star-off { opacity: .28; filter: grayscale(1); }
.cards-btn { --bg: var(--paper); --bgd: var(--line); padding: 16px; font-size: 1.6rem; font-weight: 800; flex: none; min-height: 92px; }

/* ---------- game ---------- */
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 15px; line-height: 1; }
.dot.now { box-shadow: inset 0 0 0 4px var(--ink); }
.dot.done { background: transparent; box-shadow: none; font-size: 21px; }

.play { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.ask {
  flex: 1; min-height: 0; background: var(--paper); border-radius: 30px;
  box-shadow: 0 8px 0 var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 12px; position: relative; text-align: center; overflow: hidden;
}
.hint { margin: 0; font-size: clamp(1.05rem, 4.2vmin, 1.5rem); font-weight: 800; color: var(--ink-soft); }
.big { font-family: var(--font-letter); font-weight: 800; font-size: clamp(5rem, 30vmin, 12rem); line-height: 1; margin: 0; }
.emoji { font-size: clamp(4rem, 22vmin, 9rem); line-height: 1.1; margin: 0; }
.word { font-family: var(--font-letter); font-weight: 800; font-size: clamp(2.4rem, 12vmin, 5rem); line-height: 1; margin: 0; letter-spacing: .08em; }
.word .gap { display: inline-block; min-width: .7em; border-bottom: .12em solid var(--t4d); color: var(--good-d); line-height: .9; }
.zh { margin: 0; font-size: clamp(1rem, 4vmin, 1.4rem); font-weight: 700; color: var(--ink-soft); }
.again { position: absolute; top: 10px; right: 10px; }
.pop { animation: pop .35s ease-out; }

.choices { flex: none; display: grid; gap: 14px; padding-bottom: 8px; }
.choices[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
.choices[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
.choices[data-n="6"] { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 620px) { .choices[data-n="4"] { grid-template-columns: repeat(4, 1fr); } .choices[data-n="6"] { grid-template-columns: repeat(6, 1fr); } }
.choice {
  font-family: var(--font-letter); font-weight: 800;
  font-size: clamp(2.4rem, 11vmin, 4.6rem); line-height: 1;
  height: clamp(76px, 17vmin, 130px); padding: 0;
}
.choice.right { --bg: var(--good); --bgd: var(--good-d); color: #fff; animation: hop .5s ease-out; }
.choice.wrong { --bg: var(--bad); --bgd: #A9AFBE; color: #8990A3; animation: shake .4s; pointer-events: none; }
.choices.locked .choice { pointer-events: none; }
.choice.wordy { font-size: clamp(1.25rem, 5.4vmin, 2.2rem); letter-spacing: .02em; padding: 0 6px; }
.choice.used { --bg: var(--good); --bgd: var(--good-d); color: #fff; opacity: .5; pointer-events: none; }
.choice.nope { animation: shake .4s; }

/* 翻牌、氣球、接龍：題目區縮成一條 */
.ask.slim { flex: none; min-height: 76px; padding: 10px 68px; box-shadow: 0 6px 0 var(--line); }
.trail { font-family: var(--font-letter); font-weight: 800; font-size: clamp(1.5rem, 6.4vmin, 2.4rem); line-height: 1.25; letter-spacing: .06em; margin: 0; }
.trail .todo { color: var(--line); }
.trail.target { font-size: clamp(3rem, 15vmin, 5rem); line-height: 1; }
.board { flex: 1; min-height: 0; }
.board.mem { display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 12px; align-content: center; padding-bottom: 8px; }
.mcard {
  --bg: var(--t3); --bgd: var(--t3d); color: #fff;
  font-family: var(--font-letter); font-weight: 800; font-size: clamp(2.2rem, 10vmin, 4rem); line-height: 1;
  height: clamp(84px, 24vmin, 160px); padding: 0;
}
.mcard.up { --bg: var(--paper); --bgd: var(--line); color: var(--ink); }
.mcard.hit { --bg: var(--good); --bgd: var(--good-d); color: #fff; animation: hop .5s ease-out; }
.board.sky { position: relative; overflow: hidden; border-radius: 30px; background: rgba(255, 255, 255, .4); }
.balloon {
  position: absolute; bottom: -110px; width: 84px; height: 100px; padding: 0 0 6px;
  border-radius: 50% 50% 50% 50% / 44% 44% 56% 56%;
  background: var(--bg); box-shadow: inset -9px -11px 0 rgba(43, 42, 76, .1);
  font-family: var(--font-letter); font-weight: 800; font-size: 2.9rem; line-height: 1;
  animation: rise linear forwards;
}
.balloon.dud { background: var(--bad); color: #8990A3; }
@keyframes rise { to { transform: translateY(calc(-1 * var(--rise, 900px))); } }

@media (orientation: landscape) and (max-height: 520px) {
  .play { flex-direction: row; }
  .ask { flex: 1; }
  .choices { flex: 1; align-content: center; padding-bottom: 0; }
  .choices[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
  .choices[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
  .choices[data-n="6"] { grid-template-columns: repeat(3, 1fr); }
  .choice { height: clamp(64px, 30vh, 110px); font-size: clamp(2rem, 16vh, 3.6rem); }
  .big { font-size: clamp(4rem, 42vh, 9rem); }
  .emoji { font-size: clamp(3rem, 26vh, 6rem); }
  .word { font-size: clamp(2rem, 15vh, 3.6rem); }
  .ask.slim { flex: none; width: 34%; padding: 10px; }
  .ask.slim .again { position: static; }
  .mcard { height: clamp(56px, 24vh, 110px); font-size: clamp(1.8rem, 13vh, 3rem); }
}

/* ---------- result ---------- */
#result { align-items: center; justify-content: center; text-align: center; gap: 18px; overflow-y: auto; }
.result-card { background: var(--paper); border-radius: 30px; box-shadow: 0 8px 0 var(--line); padding: 24px 20px; width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 10px; }
.result-stars { font-size: clamp(3rem, 16vmin, 5rem); line-height: 1; margin: 0; }
.result-stars span { display: inline-block; animation: pop .5s ease-out backwards; }
.result-stars span:nth-child(2) { animation-delay: .25s; } .result-stars span:nth-child(3) { animation-delay: .5s; }
.result-title { font-size: clamp(1.8rem, 8vmin, 2.6rem); font-weight: 800; margin: 0; }
.result-score { margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--ink-soft); }
.result-btns { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 460px; }
.result-btns button { padding: 14px; font-size: 1.35rem; font-weight: 800; min-height: 64px; }
#confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
#confetti i { position: absolute; top: -12vh; font-style: normal; font-size: 30px; animation: fall linear forwards; }

/* ---------- cards ---------- */
#cards { gap: 14px; }
.card-title { font-size: 1.3rem; font-weight: 800; margin: 0; }
.flash {
  --bg: var(--paper); --bgd: var(--line);
  flex: none; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 4px 12px;
  padding: 14px; border-radius: 30px; text-align: center; width: 100%;
}
.flash .pair { font-family: var(--font-letter); font-weight: 800; font-size: clamp(3.4rem, 18vmin, 7rem); line-height: 1; }
.flash .pair small { font-size: .75em; color: var(--t3d); }
.flash .emoji { font-size: clamp(3.4rem, 18vmin, 7rem); }
.flash .word { grid-column: 1 / -1; font-size: clamp(1.8rem, 8vmin, 3rem); letter-spacing: .04em; }
.flash .word b { color: #E0527C; }
.flash .zh { grid-column: 1 / -1; }
.abc { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(68px, 17vmin, 104px), 1fr)); gap: 14px; align-content: start; padding: 4px 4px 14px; }
.abc button { font-family: var(--font-letter); font-weight: 800; font-size: clamp(2.3rem, 9vmin, 3.4rem); height: clamp(68px, 17vmin, 104px); border-radius: 20px; padding: 0; line-height: 1; box-shadow: 0 4px 0 var(--bgd); }
.abc button.on { outline: 4px solid var(--ink); outline-offset: 1px; }

@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
@keyframes hop { 30% { transform: translateY(-14px) scale(1.08); } 60% { transform: translateY(0); } 80% { transform: translateY(-5px); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
@keyframes fall { to { transform: translateY(125vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { *:not(.balloon) { animation: none !important; transition: none !important; } }
</style>

<!-- ============ 首頁 ============ -->
<section class="screen" id="home">
  <div class="bar">
    <span class="bar-mid"></span>
    <button class="round-btn" id="soundBtn" aria-label="聲音開關">🔊</button>
  </div>
  <div class="hero">
    <h1 class="logo" aria-label="ABC"><span>A</span><span>B</span><span>C</span></h1>
    <p class="sub">字母樂園</p>
  </div>
  <div class="diff" id="diff" role="group" aria-label="難度"></div>
  <p class="pick" id="who"></p>
  <div class="levels" id="levels"></div>
  <button class="chunk cards-btn" id="openCards">📖 字母卡 A – Z</button>
</section>

<!-- ============ 遊戲 ============ -->
<section class="screen" id="game" hidden>
  <div class="bar">
    <button class="round-btn" data-home aria-label="回首頁">🏠</button>
    <div class="bar-mid"><div class="dots" id="dots"></div></div>
    <button class="round-btn" id="soundBtn2" aria-label="聲音開關">🔊</button>
  </div>
  <div class="play">
    <div class="ask" id="ask">
      <button class="round-btn again" id="sayAgain" aria-label="再聽一次">👂</button>
      <p class="hint" id="hint"></p>
      <div id="askBody"></div>
    </div>
    <div class="board" id="board" hidden></div>
    <div class="choices" id="choices"></div>
  </div>
</section>

<!-- ============ 結果 ============ -->
<section class="screen" id="result" hidden>
  <div class="result-card">
    <p class="result-stars" id="resStars"></p>
    <p class="result-title" id="resTitle"></p>
    <p class="result-score" id="resScore"></p>
  </div>
  <div class="result-btns">
    <button class="chunk c2" id="nextLevel">⬆️ 再難一點</button>
    <button class="chunk c1" id="playAgain">🔁 再玩一次</button>
    <button class="chunk c3" data-home>🏠 回首頁</button>
  </div>
</section>

<!-- ============ 字母卡 ============ -->
<section class="screen" id="cards" hidden>
  <div class="bar">
    <button class="round-btn" data-home aria-label="回首頁">🏠</button>
    <div class="bar-mid"><p class="card-title">點字母聽聽看，點卡片換單字</p></div>
    <span style="width:52px"></span>
  </div>
  <button class="chunk flash" id="flash" aria-label="再聽一次"></button>
  <div class="abc" id="abc"></div>
</section>

<div id="confetti" aria-hidden="true"></div>

<script>
(function () {
  'use strict';
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  // 每個字母的單字：[英文, 圖, 中文]
  var WORDS = {
    A: [['apple', '🍎', '蘋果'], ['ant', '🐜', '螞蟻'], ['airplane', '✈️', '飛機']],
    B: [['bear', '🐻', '熊'], ['banana', '🍌', '香蕉'], ['bus', '🚌', '公車']],
    C: [['cat', '🐱', '貓'], ['cake', '🍰', '蛋糕'], ['car', '🚗', '車子']],
    D: [['dog', '🐶', '狗'], ['duck', '🦆', '鴨子'], ['door', '🚪', '門']],
    E: [['egg', '🥚', '蛋'], ['elephant', '🐘', '大象'], ['eye', '👁️', '眼睛']],
    F: [['fish', '🐟', '魚'], ['frog', '🐸', '青蛙'], ['flower', '🌸', '花']],
    G: [['grapes', '🍇', '葡萄'], ['giraffe', '🦒', '長頸鹿'], ['guitar', '🎸', '吉他']],
    H: [['hat', '🎩', '帽子'], ['horse', '🐴', '馬'], ['house', '🏠', '房子']],
    I: [['ice cream', '🍦', '冰淇淋'], ['ice', '🧊', '冰塊'], ['island', '🏝️', '小島']],
    J: [['juice', '🧃', '果汁'], ['jeans', '👖', '牛仔褲'], ['jacket', '🧥', '外套']],
    K: [['key', '🔑', '鑰匙'], ['koala', '🐨', '無尾熊'], ['kite', '🪁', '風箏']],
    L: [['lion', '🦁', '獅子'], ['lemon', '🍋', '檸檬'], ['leaf', '🍃', '葉子']],
    M: [['moon', '🌙', '月亮'], ['monkey', '🐵', '猴子'], ['milk', '🥛', '牛奶']],
    N: [['nose', '👃', '鼻子'], ['nut', '🥜', '堅果'], ['night', '🌃', '夜晚']],
    O: [['orange', '🍊', '柳橙'], ['owl', '🦉', '貓頭鷹'], ['octopus', '🐙', '章魚']],
    P: [['pig', '🐷', '豬'], ['panda', '🐼', '熊貓'], ['pizza', '🍕', '披薩']],
    Q: [['queen', '👸', '皇后'], ['question', '❓', '問題'], ['quiet', '🤫', '安靜']],
    R: [['rabbit', '🐰', '兔子'], ['rainbow', '🌈', '彩虹'], ['robot', '🤖', '機器人']],
    S: [['sun', '☀️', '太陽'], ['star', '⭐', '星星'], ['snake', '🐍', '蛇']],
    T: [['tiger', '🐯', '老虎'], ['tree', '🌳', '樹'], ['train', '🚂', '火車']],
    U: [['umbrella', '☂️', '雨傘'], ['unicorn', '🦄', '獨角獸'], ['up', '⬆️', '上面']],
    V: [['violin', '🎻', '小提琴'], ['van', '🚐', '廂型車'], ['volcano', '🌋', '火山']],
    W: [['whale', '🐳', '鯨魚'], ['watermelon', '🍉', '西瓜'], ['watch', '⌚', '手錶']],
    X: [['x-ray', '🦴', 'X 光']],
    Y: [['yo-yo', '🪀', '溜溜球'], ['yellow', '💛', '黃色'], ['yawn', '🥱', '打哈欠']],
    Z: [['zebra', '🦓', '斑馬'], ['zero', '0️⃣', '零']]
  };
  // 其他常見短單字（補字母、拼單字、看圖選單字用）
  var MORE = [
    ['cow', '🐮', '牛'], ['bee', '🐝', '蜜蜂'], ['book', '📖', '書'], ['bird', '🐦', '小鳥'], ['ball', '⚽', '球'],
    ['bed', '🛏️', '床'], ['fox', '🦊', '狐狸'], ['hen', '🐔', '母雞'], ['pen', '🖊️', '筆'], ['bag', '🎒', '書包'],
    ['ship', '🚢', '船'], ['shoe', '👟', '鞋子'], ['sock', '🧦', '襪子'], ['rain', '🌧️', '雨'], ['corn', '🌽', '玉米'],

  function popBalloon(b, t) {
    if (!B.targets || G.i >= G.R) return;
    if (t !== wanted()) { G.clean = false; b.classList.add('dud'); b.disabled = true; bad(); sayTile(t); return; }
    b.remove(); good();
    G.first[G.i] = G.clean; G.i++;
    if (G.i < G.R) { newTarget(); return; }
    paintDots(); clearInterval(B.spawn); $('board').innerHTML = '';
    G.timer = setTimeout(finish, 800);
  }

  /* ---------- 字母接龍 ---------- */
  function startChain() {
    var count = [5, 8, 12][G.d], start = G.d === 0 ? 0 : Math.floor(Math.random() * (27 - count));
    var row = ABC.slice(start, start + count).map(function (c) { return G.d === 2 ? c.toLowerCase() : c; });
    B = { misses: 0, row: row, pos: 0 };
    G.R = 0; $('dots').innerHTML = '';
    $('hint').textContent = '從 ' + row[0] + ' 開始，照順序點';
    slim(true);
    G.again = function () { return B.row ? (B.row[B.pos] || '').toUpperCase() : ''; };
    paintChain();
    var box = $('choices');
    setCols(6);
    shuffle(row).forEach(function (c, k) {
      var b = tile(c, k);
      b.addEventListener('click', function () { chainTap(b, c); });
      box.appendChild(b);
    });
    talk(G.intro.slice(0, -1).concat([['照順序點字母，從這個字母開始', 'zh'], [row[0].toUpperCase(), 'en']])); G.intro = null;
  }
  function paintChain() {
    $('askBody').innerHTML = '<p class="trail">' + B.row.map(function (c, i) { return i < B.pos ? c : '<span class="todo">•</span>'; }).join(' ') + '</p>';
  }
  function chainTap(b, c) {
    if (!B.row) return;
    if (c !== B.row[B.pos]) { B.misses++; nope(b); sayTile(c); return; }
    b.classList.remove('nope'); b.classList.add('used'); b.disabled = true;
    B.pos++; paintChain(); say(c.toUpperCase());
    if (B.pos < B.row.length) { tone([400 + B.pos * 40], 0.08); return; }
    good();
    var m = B.misses;
    G.timer = setTimeout(function () { done(m <= 1 ? 3 : m <= 3 ? 2 : 1, '全部接好了，點錯 ' + m + ' 次'); }, 1100);
  }

  /* ---------- 首頁 ---------- */
  function paintHome() {
    var dbox = $('diff');
    dbox.innerHTML = '';
    DIFFS.forEach(function (D, k) {
      var b = document.createElement('button');
      b.className = 'chunk';
      b.setAttribute('aria-pressed', k === save.diff ? 'true' : 'false');
      b.innerHTML = '<span class="dpic">' + D.pic + '</span><span>' + D.name + '</span>';
      b.addEventListener('click', function () { save.diff = k; persist(); tone([520 + k * 120], 0.08); paintHome(); zh(D.name + '，' + D.who); });
      dbox.appendChild(b);
    });
    $('who').textContent = DIFFS[save.diff].who + '，再選一個遊戲';
    var box = $('levels');
    box.innerHTML = '';
    GAMES.forEach(function (g, k) {
      var best = save.best[g.key + '-' + save.diff] || 0;
      var b = document.createElement('button');
      b.className = 'chunk level c' + (k % 6 + 1);
      b.innerHTML = '<span class="pic">' + g.pic + '</span><span class="name">' + g.name + '</span>' +
        '<span class="best" aria-label="最佳成績 ' + best + ' 顆星">' + stars(best, 3) + '</span>';
      b.addEventListener('click', function () { tone([660], 0.08); startGame(k); });
      box.appendChild(b);
    });
  }

  /* ---------- 字母卡 ---------- */
  var cur = 'A', curIdx = 0;
  function paintCard(L, idx, speak) {
    cur = L; curIdx = idx % WORDS[L].length;
    var w = WORDS[L][curIdx], word = w[0], total = WORDS[L].length;
    $('flash').innerHTML = '<span class="pair">' + L + '<small>' + L.toLowerCase() + '</small></span>' +
      '<span class="emoji">' + w[1] + '</span>' +
      '<span class="word"><b>' + word[0].toUpperCase() + '</b>' + word.slice(1) + '</span>' +
      '<span class="zh">' + w[2] + (total > 1 ? '　' + (curIdx + 1) + ' / ' + total : '') + '</span>';
    Array.prototype.forEach.call($('abc').children, function (b) { b.classList.toggle('on', b.textContent === L); });
    if (speak) say(L + '. ' + word);
  }
  function buildCards() {
    var box = $('abc');
    ABC.forEach(function (L, k) {
      var b = document.createElement('button');
      b.className = 'chunk c' + (k % 6 + 1);
      b.textContent = L;
      b.addEventListener('click', function () { paintCard(L, 0, true); });
      box.appendChild(b);
    });
    $('flash').addEventListener('click', function () { paintCard(cur, curIdx + 1, true); });
  }

  /* ---------- 綁定 ---------- */
  $('soundBtn').addEventListener('click', toggleSound);
  $('soundBtn2').addEventListener('click', toggleSound);
  $('sayAgain').addEventListener('click', function () { talk([[$('hint').textContent, 'zh'], [G.again ? G.again() : '', 'en']]); });
  $('playAgain').addEventListener('click', function () { startGame(G.game); });
  $('nextLevel').addEventListener('click', function () { // 同一個遊戲，難度加一級
    save.diff = Math.min(G.d + 1, DIFFS.length - 1); persist(); paintHome(); startGame(G.game, DIFFS[save.diff].name);
  });
  $('openCards').addEventListener('click', function () { show('cards'); paintCard(cur, curIdx, false);
    talk([['字母卡', 'zh'], [cur + '. ' + WORDS[cur][curIdx][0], 'en']]);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-home]'), function (b) {
    b.addEventListener('click', function () { stopAll(); $('board').innerHTML = ''; $('confetti').innerHTML = ''; show('home'); zh('回首頁'); });
  });

  paintSound(); paintHome(); buildCards(); paintCard('A', 0, false);
})();
</script>
